[package]
name = "loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = { version = "0.10", default-features = false }
log = { version = "0.4", default-features = false }
romcore = { path = "../romcore" }
uefi = { version = "0.41", features = ["global_allocator", "logger", "panic_handler", "alloc"] }
# Raw protocol layout access (LoadedImage image_base/size for the P2-7
# preload integrity probe); already in the tree as uefi's own dependency.
uefi-raw = "0.17"

[features]
default = []
# M3-class transaction machinery (BAR0 writes, engine reset/DMA/ignition).
# OFF by default: the shipped binary contains zero GPU-write paths; a "tx"
# build is the gated artifact (constitution 1.7 - never flash one without
# the explicit user go).
tx = []

# Shared code for both delivery forms; main.rs (USB app) and dxe_main.rs
# (firmware-resident DXE driver) are thin entries over this lib.
[lib]
name = "loader"
path = "src/lib.rs"

[[bin]]
name = "loader"
path = "src/main.rs"

# Firmware-resident DXE driver form (docs/dxe-driver-ffs-feasibility.md).
# ffspack patches the PE subsystem to EFI_BOOT_SERVICE_DRIVER and wraps the
# image as an FFS file for manual firmware insertion; the unpatched .EFI
# also loads via the UEFI shell `load` command (zero-flash smoke path).
[[bin]]
name = "nvunlock-dxe"
path = "src/dxe_main.rs"

[build-dependencies]
# none: build.rs uses std only
