[package]
name = "loader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = { version = "0.10", default-features = false }
log = { version = "0.4", default-features = false }
romcore = { path = "../romcore" }
uefi = { version = "0.41", features = ["global_allocator", "logger", "panic_handler", "alloc"] }
# Raw protocol layout access (LoadedImage image_base/size for the P2-7
# preload integrity probe); already in the tree as uefi's own dependency.
uefi-raw = "0.17"

[features]
default = []
# Diagnostic profile (soft-lock family, #279 request): the FULL surgery
# (detach/claim/COMMAND/DMA/bridge-BME/native-GOP rebuild/reconnect) plus
# the observers (ebs-watch, agitate-only) with the payload paths (FWSEC
# ignition, booter fire, selectors, transaction replay) EXCLUDED from the
# binary - \tx-agitate-only.txt is the only GPU-touching branch and it
# writes nothing to BAR0 by contract. tx implies diag.
diag = []
# M3-class transaction machinery (BAR0 writes, engine reset/DMA/ignition).
# OFF by default: the shipped binary contains zero GPU-write paths; a "tx"
# build is the gated artifact (constitution 1.7 - never flash one without
# the explicit user go).
tx = ["diag"]

[build-dependencies]
# none: build.rs uses std only
