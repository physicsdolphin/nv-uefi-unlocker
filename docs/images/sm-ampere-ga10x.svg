<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="448" viewBox="0 0 1240 448" font-family="system-ui, sans-serif">
  <!-- Ampere GA10x SM block diagram (GA102/104/106/107, CC 8.6). Structure per GA102 whitepaper; rates cross-verified against 3090 peak numbers; fuse tiers per cmp170hx compute-throttle.md. -->
  <rect x="1" y="1" width="1238" height="446" fill="#fdfdfb" stroke="#999"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#111">Ampere GA10x SM（GA102/104/106/107 · CC 8.6）· 每时钟每 SM 吞吐</text>
  <text x="24" y="56" font-size="13" fill="#555">4 分区 × {32 FP32 + 1× 三代张量核 + SFU + LD/ST} ｜ 寄存器 64K ｜ 与 GA100（CC 8.0，32× FP64/SM）不同，消费 GA10x FP64 仅 2/SM</text>

  <!-- processing block -->
  <g>
    <rect x="24" y="76" width="212" height="150" fill="#eef3fb" stroke="#4a76b8" rx="6"/>
    <text x="34" y="96" font-size="13" font-weight="bold" fill="#244">处理分区 ×4</text>
    <rect x="38" y="106" width="184" height="28" fill="#dbe8f8" stroke="#4a76b8" rx="4"/>
    <text x="46" y="125" font-size="12" fill="#111">FP32 核 ×32（128 FMA/clk）</text>
    <rect x="38" y="140" width="184" height="28" fill="#fbeee0" stroke="#c8823c" rx="4"/>
    <text x="46" y="159" font-size="12" fill="#111">张量核 gen3 ×1（HMMA/IMMA）</text>
    <rect x="38" y="174" width="184" height="28" fill="#e8e4f5" stroke="#7a5fb8" rx="4"/>
    <text x="46" y="193" font-size="13" fill="#111">SFU ×4 ｜ LD/ST ×8</text>
  </g>
  <text x="244" y="156" font-size="14" fill="#333">×4</text>

  <!-- rates table -->
  <g font-size="13" fill="#111">
    <rect x="428" y="76" width="400" height="150" fill="#f2f7f2" stroke="#5a9a5a" rx="6"/>
    <text x="440" y="98" font-weight="bold" fill="#244">张量路径速率（半字 FMA/clk/SM）</text>
    <text x="440" y="120">FP16·FP16acc：256（全速出货）</text>
    <text x="440" y="142">FP16/BF16·FP32acc：256 → 🔒出货 128</text>
    <text x="440" y="164">TF32·FP32acc：128（标准 30 系全速出货）</text>
    <text x="440" y="186">INT8·IMMA：512（全速出货，= 2× FP16acc）</text>
    <text x="440" y="208">FP64：1 FMA（≈ FP32 的 1/64，架构性）</text>
  </g>

  <!-- fuse tier -->
  <rect x="852" y="76" width="364" height="150" fill="#fdecec" stroke="#c0392b" rx="6"/>
  <text x="864" y="100" font-size="14" font-weight="bold" fill="#c0392b">🔒 消费档熔丝（cmp170hx 熔丝普查）</text>
  <text x="864" y="122" font-size="13" fill="#111">FUSE_SS_FMLA32 / IMLA4 = 0x1 档</text>
  <text x="864" y="144" font-size="13" fill="#111">= FP16·FP32acc 张量半速（3080/3090/Ti 全档）</text>
  <text x="864" y="166" font-size="13" fill="#111">FEAT_READOUT_1 = 0x00400080（锁定签名）</text>
  <text x="864" y="188" font-size="13" fill="#111">A6000/A100 档 = 0x0（专业卡无此钳制）</text>
  <text x="864" y="210" font-size="13" fill="#111">CMP 矿卡 = 最大分频（÷32）</text>

  <!-- SM-level -->
  <rect x="24" y="244" width="1192" height="76" fill="#f4f4ee" stroke="#888" rx="6"/>
  <text x="36" y="264" font-size="13" fill="#111">白皮书峰值（3090 · GA102 · 82 SM · 1.71 GHz 自验算）：FP16·FP16acc 71 TFLOPS dense → FP32acc 35.3 = ×0.5 ｜ INT8 284 TOPS</text>
  <text x="36" y="284" font-size="13" fill="#111">TF32 35.6 ｜ FP64 0.56（≈ FP32 的 1/64，架构性）</text>
  <text x="36" y="304" font-size="13" fill="#555">自验算：82 SM × 256 FMA × 2 FLOP × 1.71 GHz ≈ 71.5 TF ✓（张量核每 SM 每时钟 256 半字 FMA 口径成立）</text>

  <!-- evidence -->
  <rect x="24" y="332" width="1192" height="64" fill="#eef6ee" stroke="#5a9a5a" rx="6"/>
  <text x="36" y="356" font-size="13" fill="#111">本仓实测：3060 2504 FP16 1.80×（#70/#71）｜ 3090 20GB 形态 FP16 +48.9% / TF32 +79.9%（异常钳制形态）</text>
  <text x="36" y="378" font-size="13" fill="#555">GA10x 白皮书把 FP32acc 半速直接写成消费卡规格——与 Ada「白皮书全速、出货半速」不同。</text>

  <text x="24" y="416" font-size="12" fill="#777">来源：GA102 白皮书 v2.1 / Ampere Tuning Guide（CC 8.6 FP32 吞吐 = 2× CC 8.0）/ cmp170hx compute-throttle.md 熔丝普查 / 本仓 compatibility.md。</text>
  <text x="24" y="434" font-size="12" fill="#777">GA100（CC 8.0）不在本工具范围：FP64 32/SM、张量 gen3 全档、无消费钳制。</text>
</svg>
