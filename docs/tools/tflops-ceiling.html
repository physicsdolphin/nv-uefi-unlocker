<style>
:root{--background:#fff;--foreground:#111;--muted:#e8e8e8;--muted-foreground:#666;--border:#ddd;--viz-series-1:#c2410c;--viz-series-2:#0e7490;--viz-series-3:#4d7c0f;--font-size-base:14px;color-scheme:light dark}

body{margin:0;background:var(--background);color:var(--foreground);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
main{max-width:960px;margin:0 auto}
footer{max-width:960px;margin:12px auto 24px;font-size:12px;color:var(--muted-foreground);line-height:1.6}
#gc-lang{appearance:none;background:none;border:1px solid var(--border);border-radius:3px;color:var(--muted-foreground);font:inherit;font-size:11px;line-height:1;padding:5px 7px;cursor:pointer;white-space:nowrap}
#gc-lang:hover{color:var(--foreground);border-color:currentColor}
</style>
<main>
<div id="gpu-ceiling">
<style>
#gpu-ceiling{--gc-20:var(--viz-series-3);--gc-30:var(--viz-series-2);--gc-40:var(--viz-series-1);--gc-lock:color-mix(in oklab,var(--foreground) 22%,var(--muted));font-size:var(--font-size-base);color:var(--foreground)}
#gpu-ceiling .hd{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin-bottom:2px}
#gpu-ceiling .tl{font-weight:500;font-size:calc(var(--font-size-base) + 2px)}
#gpu-ceiling .sub{color:var(--muted-foreground);font-size:12px}
#gpu-ceiling .tabs{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0 6px;border-bottom:1px solid var(--border)}
#gpu-ceiling .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted-foreground);font:inherit;font-size:12px;padding:4px 8px;cursor:pointer}
#gpu-ceiling .tab[aria-selected="true"]{color:var(--foreground);border-bottom-color:var(--foreground)}
#gpu-ceiling .tab .ct{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
#gpu-ceiling .ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin-bottom:8px;font-size:12px;color:var(--muted-foreground)}
#gpu-ceiling .ctl .peak{font-variant-numeric:tabular-nums;color:var(--foreground)}
#gpu-ceiling .sws{display:inline-flex;flex-wrap:wrap;gap:4px 12px}

#gpu-ceiling .sw input{accent-color:var(--foreground);margin:0}

#gpu-ceiling .lg i{display:inline-block;width:16px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
#gpu-ceiling .rows{margin:0;padding:0;list-style:none}
#gpu-ceiling .rw{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(88px,30%) 104px;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid var(--border)}
#gpu-ceiling .rw.na{opacity:.45}
#gpu-ceiling .rk{color:var(--muted-foreground);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
#gpu-ceiling .nm{font-size:12px;min-width:0;overflow-wrap:anywhere}
#gpu-ceiling .nm .bd{font-size:11px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:3px;padding:0 3px;margin-left:5px;vertical-align:1px}
#gpu-ceiling .nm .mt{font-size:11px;color:var(--muted-foreground);margin-left:5px;font-variant-numeric:tabular-nums}
#gpu-ceiling .nm .mb{color:var(--foreground);border-color:currentColor}
#gpu-ceiling .nm .up{color:var(--muted-foreground);font-size:11px;margin-left:2px}
#gpu-ceiling .trk{position:relative;height:9px;background:var(--muted);border-radius:2px;overflow:hidden}
#gpu-ceiling .bar{position:absolute;inset:0 auto 0 0;border-radius:2px}
#gpu-ceiling .vl{font-size:11px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
#gpu-ceiling .vl .ar{color:var(--muted-foreground);padding:0 2px}
#gpu-ceiling .vl .nw{color:var(--muted-foreground);font-size:11px}
#gpu-ceiling .g20 .bar{background:var(--gc-20)}
#gpu-ceiling .g30 .bar{background:var(--gc-30)}
#gpu-ceiling .g40 .bar{background:var(--gc-40)}
#gpu-ceiling .g50 .bar{background:var(--muted-foreground)}
#gpu-ceiling .trk .bar.lock{background:var(--muted);background-color:var(--gc-lock)}
#gpu-ceiling .ft{margin-top:8px;font-size:11px;line-height:1.5;color:var(--muted-foreground)}
#gpu-ceiling .ft p{margin:0 0 2px}
#gpu-ceiling .ft code{font-size:11px}
#gpu-ceiling .rw.sel{background:var(--muted);box-shadow:inset 3px 0 0 var(--foreground)}
#gpu-ceiling .rw.sel .nm{font-weight:600}
#gpu-ceiling .jr{font-size:11px;color:var(--foreground);border:1px solid var(--border);border-radius:3px;padding:0 3px;margin-left:5px;font-variant-numeric:tabular-nums;vertical-align:1px}
#gpu-ceiling.cmp .rw:not(.na){cursor:pointer}
#gpu-ceiling .sw.dis{opacity:.45}
@media (max-width:440px){
  #gpu-ceiling .rw{grid-template-columns:18px minmax(0,1fr) 92px;row-gap:2px}
  #gpu-ceiling .trk{grid-column:2/4}
  #gpu-ceiling .vl{grid-column:3;grid-row:1}
}
</style>

      jrA:"出厂第",jrB:" → 现第",peak:"该精度最高 ",peakNone:"该精度无可用型号",
      notes:{f:"FP32 走 CUDA 核，出厂即全速，解锁不改变它。",
        t:"TF32 仅 30/40 系具备。30 系出厂即全速（† 不翻倍）；40 系架构速率本就是 FP32 的两倍、出厂砍半，所以出厂 TF32 恰好等于 FP32（GeForce 的著名怪象），解锁才回到 2× FP32。",
        h:"FP16 为张量核 · FP32 累加路径，即被钳制的那条；FP16 累加更宽，独立于本表。",

      ft:["数值 = SM × 每 SM 每时钟 FMA × 2 × 加速频率。解锁 = 恢复白皮书全速，钳制路径 ×2；不含稀疏。",
        "实际到手通常低于此值：功耗墙、显存带宽、库路由各自打折（见 <code>docs/theoretical-uplift.md</code>）。",
        "† 该卡 TF32 出厂未被钳制（30 系与 GA107 的 2050），解锁不带来增益，故 ×2 不适用。",

        "矿卡（CMP）：全路出厂 ÷32（与 GeForce 写同一组 SS0/SS1 速率寄存器，解锁原理相同），故解锁增益 32×；170HX 实测 FP32 0.395→12.7 TFLOPS 印证该模型。40/50HX=Turing 硅片，70/90/170HX=Ampere 硅片；30HX（TU116，无张量核）未列。",
        "50 系为出厂对照行（本工具不支持 RTX 50）：取 TPU/规格表出货列——TF32=1×FP32、FP16/BF16=2×FP32、FP8=4×FP32（TPU 5090 页锚定），与 40 系出厂钳制比例相同但无从解锁；FP4/FP6 不进图（40 系及以前没有）。5090 D V2 资料不全未列。",

        "比较模式：点击卡片行选中你的卡（可多选，再点取消）——选中卡按解锁后数值排位并高亮，其余卡按出厂值排位；行内徽标显示排位变化，切到其他精度页签可带着同一组选择继续比较。"],
      foot:"数据来源：Wikipedia 各代桌面规格表 × <code>docs/theoretical-uplift.md</code> 的逐 SM 速率模型；解锁值 = 白皮书全速，被钳制路径 ×2，不含稀疏。实际到手受功耗墙、带宽与库路由削减。"

    en:{
      docTitle:"Theoretical post-unlock ceiling · RTX 20 / 30 / 40 desktop and laptop",
      h1:"Theoretical post-unlock ceiling · RTX 20 / 30 / 40 desktop + laptop",
      sub:"dense TFLOPS · FP32 accumulate · no sparsity · laptops take the highest boost clock, not derated per OEM TGP",
      tabsLabel:"Precision",lang:"中文",langTitle:"切换到中文",
      stock:"Show as-shipped",mob:"Include laptops",cmp:"Comparison mode",r50:"RTX 50 reference",
      lg:["As-shipped (clamped)","RTX 20","RTX 30","Post-unlock ceiling","RTX 50 reference (no unlock)"],
      na:"n/a",lap:"laptop",kBadge:"mining card",gen:"xx",naPath:": no such path on this generation",

      jrA:"as-shipped #",jrB:" → now #",peak:"fastest for this precision: ",peakNone:"no model offers this precision",
      notes:{f:"FP32 runs on the CUDA cores; it is full speed as shipped and unlock does not change it.",

      ft:["Value = SM × FMA per SM per clock × 2 × boost clock. Unlock = restore the whitepaper full rate, ×2 on the clamped path; no sparsity.",
        "Real-world results usually land below these figures: power wall, memory bandwidth and library routing each take their cut (see <code>docs/theoretical-uplift.en.md</code>).",
        "† TF32 is not clamped on this card as shipped (RTX 30 and the GA107-based 2050), so unlock gains nothing and ×2 does not apply.",
        "Chip column notes: cards that shipped on more than one die are annotated per row (e.g. RTX 3050 8 GB comes in GA107 and GA106 batches, RTX 4070 Ti SUPER has an AD102 variant, RTX 2060 has a TU104 variant, RTX 2050 is really GA107); split-out variants are listed by their actual die and clock.",
        "Mining cards (CMP): every path is ÷32 as shipped (they write the same SS0/SS1 rate registers as GeForce, so the mechanism is identical), hence a 32× unlock gain; the measured 170HX FP32 0.395→12.7 TFLOPS confirms the model. 40/50HX are Turing dies, 70/90/170HX are Ampere dies; 30HX (TU116, no tensor cores) is omitted.",
        "RTX 50 rows are as-shipped reference only (this tool does not support RTX 50): TPU/spec-sheet shipping columns — TF32=1×FP32, FP16/BF16=2×FP32, FP8=4×FP32 (anchored on the TPU 5090 page), the same factory ratios as RTX 40 but not unlockable; FP4/FP6 are not charted (no pre-40 generation has them). The 5090 D V2 is omitted for lack of data.",
        "Laptop rows take the model's highest boost clock, not derated per OEM TGP — after unlock they hit the power wall harder; Max-Q variants are not split out. The RTX 2050 is really a GA107 (Ampere) die, hence TF32/BF16.",
        "Comparison mode: click a card row to select it (multi-select, click again to clear) — selected cards rank and highlight by post-unlock figures, the rest by as-shipped values; the inline badge shows the rank change, and switching precision tabs carries the same selection."],
      foot:"Sources: Wikipedia per-generation desktop spec tables × the per-SM rate model in <code>docs/theoretical-uplift.en.md</code>; unlock values are the whitepaper full rate, ×2 on clamped paths, no sparsity. Real results are cut by the power wall, bandwidth and library routing."

  };
  var CHIP_EN={"TU106（TU106 标准版换芯）":"TU106 (standard TU106 re-die)","GA107/GA106 双芯":"GA107/GA106 dual die","GA106 · 亦有 GA104 变体":"GA106 · also a GA104 variant","GA104（GA106 标准版换芯）":"GA104 (standard GA106 re-die)","GA107（Ampere 硅片）":"GA107 (Ampere die)","TU106 · 亦有 TU104 变体":"TU106 · also a TU104 variant","AD103 · 亦有 AD102 变体（同规格）":"AD103 · also an AD102 variant (same specs)","TU106-100 · 2176 核":"TU106-100 · 2176 cores","TU102-100 · 3584 核":"TU102-100 · 3584 cores","GA104-100 · 3840 核":"GA104-100 · 3840 cores","GA100-105F · 4480 核":"GA100-105F · 4480 cores"};
  var lang="zh";
  function t(){return S[lang];}
  function chip(c){return lang==="en"?(CHIP_EN[c]||c):c;}
  var root=document.getElementById("gpu-ceiling"),rowsEl=document.getElementById("gc-rows"),
      peakEl=document.getElementById("gc-peak"),ftEl=document.getElementById("gc-ft"),footEl=document.getElementById("gc-foot"),
      h1El=document.getElementById("gc-h1"),subEl=document.getElementById("gc-sub"),tabsEl=document.getElementById("gc-tabs"),
      langEl=document.getElementById("gc-lang"),
      stockEl=document.getElementById("gc-stock"),mobEl=document.getElementById("gc-mob"),cmpEl=document.getElementById("gc-cmp"),r50El=document.getElementById("gc-r50");
  var KMAP={fp32:"f",tf32:"t",fp16:"h",bf16:"b",fp8:"e"};
  var qk=new URLSearchParams(location.search).get("k");qk=KMAP[qk]||qk;
  var cur=TABS.some(function(t){return t.k===qk;})?qk:((window.zcode&&window.zcode.widgetState&&window.zcode.widgetState.modelContent||{}).p||"f");
  var show=(window.zcode&&window.zcode.widgetState&&window.zcode.widgetState.privateContent||{}).s;
  if(show===undefined)show=true;
  var showMob=(window.zcode&&window.zcode.widgetState&&window.zcode.widgetState.privateContent||{}).mo;
  if(showMob===undefined)showMob=true;
  stockEl.checked=show;mobEl.checked=showMob;
  var pc0=(window.zcode&&window.zcode.widgetState&&window.zcode.widgetState.privateContent)||{};
  var cmp=pc0.c||false;
  var show50=!(pc0.r50===false);
  var sel={};
  (pc0.l||[]).forEach(function(n){sel[n]=true;});
  cmpEl.checked=cmp;r50El.checked=show50;
  var ql=new URLSearchParams(location.search).get("lang");
  if(ql==="en"||ql==="zh")lang=ql;
  else if(pc0.lang==="en"||pc0.lang==="zh")lang=pc0.lang;

  function val(c,k){ return k==="f"?(Array.isArray(c.f)?c.f:[c.f,c.f]):c[k]; }
  function full(c){ return Array.isArray(c.f)?c.f[1]:c.f; }
  function fmt(v){ return v.toFixed(1); }

  function draw(){
    var tab=TABS.filter(function(x){return x.k===cur;})[0]||TABS[0];
    document.querySelectorAll("#gpu-ceiling .tab").forEach(function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-k")===cur ? "true":"false");
    });
    root.classList.toggle("cmp",cmp);
    stockEl.disabled=cmp;
    stockEl.parentNode.classList.toggle("dis",cmp);
    var items=D.filter(function(c){return (showMob||!c.m)&&(show50||c.g!=="50");}).map(function(c){
      var v=val(c,cur);
      return {c:c, v:v, max: v?v[1]:null, lo: v?v[0]:null};
    });
    var sup=items.filter(function(i){return i.max!==null;});
    var maxV=sup.reduce(function(m,i){return Math.max(m,i.max);},0.1);
    var stockRank={};
    sup.slice().sort(function(a,b){return b.lo-a.lo||full(b.c)-full(a.c);}).forEach(function(i,ix){stockRank[i.c.n]=ix+1;});
    function eff(i){return cmp&&sel[i.c.n]?i.max:i.lo;}
    if(cmp)sup.sort(function(a,b){var d=eff(b)-eff(a);return d||full(b.c)-full(a.c);});
    else sup.sort(function(a,b){return b.max-a.max;});
    var rest=items.filter(function(i){return i.max===null;}).sort(function(a,b){return full(b.c)-full(a.c);});
    var list=sup.concat(rest);

    rowsEl.innerHTML="";
    list.forEach(function(it,n){
      var c=it.c,li=document.createElement("li");
      var isSel=cmp&&!!sel[c.n];
      li.className="rw g"+c.g+(it.max===null?" na":"")+(isSel?" sel":"");
      li.setAttribute("data-n",c.n);
      var jr="";
      if(isSel&&it.max!==null&&stockRank[c.n]&&stockRank[c.n]!==n+1)
        jr='<span class="jr">'+t().jrA+stockRank[c.n]+t().jrB+(n+1)+'</span>';
      var desc;
      if(it.max===null){
        desc=c.n+t().naPath;
      }else if(!tab.t){
        desc=c.n+t().same+full(c)+t().sameEnd;
      }else if(cmp){
        desc=c.n+(isSel?(t().selPrefix+fmt(it.max)+t().selMid+stockRank[c.n]+t().selEnd)
                        :(t().unselPrefix+fmt(it.lo)+t().unselEnd));
      }else{
        desc=c.n+t().stockPrefix+fmt(it.lo)+t().unlockCap+fmt(it.max)+t().tfEnd;
      }
      li.setAttribute("aria-label",desc);
      if(cmp&&it.max!==null){li.setAttribute("role","button");li.setAttribute("tabindex","0");}
      var ov=(it.max!==null&&(isSel||(!cmp&&show))&&it.lo!==it.max);
      var pctFull=it.max===null?0:((cmp&&!isSel)?it.lo:it.max)/maxV*100;
      var pctLo=ov?it.lo/maxV*100:0;
      li.innerHTML='<div class="rk">'+(it.max===null?"—":n+1)+'</div>'+
        '<div class="nm">'+c.n+(c.m?'<span class="bd mb">'+t().lap+'</span>':'')+(c.k?'<span class="bd mb">'+t().kBadge+'</span>':'')+'<span class="bd">'+c.g+t().gen+'</span><span class="mt">'+chip(c.c)+' · '+c.s+' SM</span>'+jr+
        (cur==="t"&&c.t&&c.t[0]===c.t[1]?'<span class="up">†</span>':'')+'</div>'+
        '<div class="trk">'+(it.max===null?'':('<div class="bar" style="width:'+pctFull+'%"></div>'+
          (ov?'<div class="bar lock" style="width:'+pctLo+'%"></div>':'')+'</div>'))+
        '<div class="vl">'+(it.max===null?'<span class="nw">'+t().na+'</span>':
          (ov?fmt(it.lo)+' <span class="ar">→</span> ':'')+fmt(ov?it.max:(cmp&&!isSel?it.lo:it.max)))+'</div>';
      rowsEl.appendChild(li);
    });

    peakEl.textContent=sup.length?(t().peak+sup[0].c.n.replace("GeForce RTX ","RTX ")+" · "+(cmp?fmt(eff(sup[0])):(sup[0].lo===sup[0].max?fmt(sup[0].max):fmt(sup[0].lo)+" → "+fmt(sup[0].max)))):t().peakNone;
    document.querySelectorAll("#gpu-ceiling .tab").forEach(function(b){
      var k=b.getAttribute("data-k");
      var n=D.filter(function(c){return (showMob||!c.m)&&(k==="f"?c.f:c[k])!==null;}).length;
      if(!b.querySelector(".ct")){var s=document.createElement("span");s.className="ct";b.appendChild(s);}
      b.querySelector(".ct").textContent=" "+n;
    });
    var st=t(),f=st.ft;
    ftEl.innerHTML='<p>'+st.notes[cur]+'</p>'+
      '<p>'+f[0]+'</p>'+
      '<p>'+f[1]+'</p>'+
      (cur==="t"?'<p>'+f[2]+'</p>':'')+
      '<p>'+f[3]+'</p>'+
      '<p>'+f[4]+'</p>'+
      '<p>'+f[5]+'</p>'+
      (showMob?'<p>'+f[6]+'</p>':'')+
      (cmp?'<p>'+f[7]+'</p>':'');
    save();
  }

  function applyLang(){
    var st=t();
    document.documentElement.lang=(lang==="en"?"en":"zh-CN");
    document.title=st.docTitle;
    h1El.textContent=st.h1;subEl.textContent=st.sub;
    tabsEl.setAttribute("aria-label",st.tabsLabel);
    langEl.textContent=st.lang;langEl.title=st.langTitle;
    ["stock","mob","cmp","r50"].forEach(function(k){var el=document.getElementById("l-"+k);if(el)el.textContent=st[k];});
    for(var i=0;i<5;i++){var el=document.getElementById("l-lg"+i);if(el)el.textContent=st.lg[i];}
    footEl.innerHTML=st.foot;
    draw();
  }

  function save(){
    if(!window.zcode||!window.zcode.setWidgetState)return;
    try{window.zcode.setWidgetState({modelContent:{p:cur},privateContent:{s:show,mo:showMob,c:cmp,r50:show50,lang:lang,l:Object.keys(sel).filter(function(n){return sel[n];})}}).catch(function(){});}catch(e){}
  }

  document.querySelectorAll("#gpu-ceiling .tab").forEach(function(b){
    b.addEventListener("click",function(){cur=b.getAttribute("data-k");draw();});
  });
  stockEl.addEventListener("change",function(){show=stockEl.checked;draw();});
  mobEl.addEventListener("change",function(){showMob=mobEl.checked;draw();});
  cmpEl.addEventListener("change",function(){cmp=cmpEl.checked;draw();});
  r50El.addEventListener("change",function(){show50=r50El.checked;draw();});
  langEl.addEventListener("click",function(){lang=(lang==="en"?"zh":"en");applyLang();});
  function toggleRow(li){
    var nm=li.getAttribute("data-n");
    if(!nm)return;
    if(sel[nm])delete sel[nm];else sel[nm]=true;
    draw();
  }
  rowsEl.addEventListener("click",function(ev){
    if(!cmp)return;
    var li=ev.target.closest(".rw");
    if(!li||li.classList.contains("na"))return;
    toggleRow(li);
  });
  rowsEl.addEventListener("keydown",function(ev){
    if(!cmp||(ev.key!=="Enter"&&ev.key!==" "))return;
    var li=ev.target.closest?ev.target.closest(".rw"):null;
    if(!li||li.classList.contains("na"))return;
    ev.preventDefault();
    toggleRow(li);
  });
  document.addEventListener("zcode:set_globals",function(e){
    var g=e.detail&&e.detail.globals&&e.detail.globals.widgetState;
    if(!g)return;
    if(g.modelContent&&g.modelContent.p&&TABS.some(function(t){return t.k===g.modelContent.p;}))cur=g.modelContent.p;
    if(g.privateContent&&typeof g.privateContent.s==="boolean"){show=g.privateContent.s;stockEl.checked=show;}
    if(g.privateContent&&typeof g.privateContent.mo==="boolean"){showMob=g.privateContent.mo;mobEl.checked=showMob;}
    if(g.privateContent&&typeof g.privateContent.c==="boolean"){cmp=g.privateContent.c;cmpEl.checked=cmp;}
    if(g.privateContent&&typeof g.privateContent.r50==="boolean"){show50=g.privateContent.r50;r50El.checked=show50;}
    if(g.privateContent&&g.privateContent.l&&g.privateContent.l.forEach){sel={};g.privateContent.l.forEach(function(n){sel[n]=true;});}
    if(g.privateContent&&(g.privateContent.lang==="en"||g.privateContent.lang==="zh"))lang=g.privateContent.lang;
    applyLang();
  });
  applyLang();
})();
</script>
